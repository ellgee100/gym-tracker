<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Gym Tracker</title>
  <style>
    :root {
      --bg:#f3f4f6; --card:#fff; --text:#111827; --muted:#6b7280; --border:#e5e7eb;
      --primary:#111827; --good:#166534; --good-bg:#dcfce7; --warn:#92400e; --warn-bg:#fef3c7;
      --danger:#b91c1c; --danger-bg:#fee2e2; --blue:#1d4ed8; --blue-bg:#dbeafe;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    button,input,textarea,select{font:inherit} button{cursor:pointer}
    .app{max-width:760px;margin:0 auto;min-height:100vh;padding:20px 16px 72px}
    h1{font-size:30px;margin:8px 0 4px} h2{margin:0 0 10px} h3{margin:0 0 8px}
    .subtitle{color:var(--muted);margin-bottom:22px}.section{margin-top:26px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .big-button{min-height:78px;border:0;border-radius:16px;background:var(--card);padding:16px;font-weight:700;font-size:17px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
    .big-button.primary{background:var(--primary);color:white}.big-button.danger{color:var(--danger)}
    .card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
    .row{display:flex;align-items:center;gap:10px}.space-between{justify-content:space-between}.wrap{flex-wrap:wrap}
    .muted{color:var(--muted);font-size:14px}.tiny{font-size:12px}.exercise-title{font-size:19px;font-weight:700}
    .note{margin-top:8px;color:#374151;font-size:14px;background:#f9fafb;padding:9px 10px;border-radius:10px}
    .set-row{display:grid;grid-template-columns:40px 1fr 1fr 42px;gap:8px;align-items:center;margin-top:10px}
    input,textarea,select{width:100%;border:1px solid var(--border);border-radius:10px;padding:11px;background:white;color:var(--text)}
    textarea{resize:vertical;min-height:70px}.small-button{border:1px solid var(--border);background:white;border-radius:10px;padding:9px 12px}
    .small-button.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
    .add-button{width:100%;margin-top:12px;border:1px dashed #9ca3af;background:transparent;border-radius:12px;padding:12px;font-weight:600}
    .delete-button{border:0;background:transparent;color:var(--danger);font-size:18px;padding:6px}
    .finish{width:100%;border:0;border-radius:14px;padding:16px;font-weight:700;font-size:17px;background:var(--primary);color:white;margin-top:20px}
    .success,.warning,.info,.danger-box{padding:10px 12px;border-radius:10px;margin-top:10px;font-weight:600;font-size:14px}
    .success{background:var(--good-bg);color:var(--good)}.warning{background:var(--warn-bg);color:var(--warn)}.info{background:var(--blue-bg);color:var(--blue)}.danger-box{background:var(--danger-bg);color:var(--danger)}
    .back{border:0;background:transparent;padding:0;margin-bottom:16px;color:#374151}.history-item{padding:12px 0;border-bottom:1px solid var(--border)}.history-item:last-child{border-bottom:0}
    .pill{display:inline-block;font-size:12px;padding:4px 8px;border-radius:999px;background:#f3f4f6;color:#4b5563;margin:2px 4px 2px 0}
    .pill.primary{background:#e5e7eb;color:#111827}.pill.secondary{background:#f3f4f6;color:#6b7280}
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:1000}
    .modal{background:white;width:100%;max-width:560px;max-height:86vh;overflow:auto;border-radius:18px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
    .list-button{width:100%;border:1px solid var(--border);background:#fff;border-radius:12px;padding:13px;text-align:left;margin-bottom:8px}
    .list-button:hover{background:#f9fafb}.search{margin:12px 0}.divider{height:1px;background:var(--border);margin:16px 0}
    .template-exercise{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
    .template-exercise:last-child{border-bottom:0}.icon-button{border:1px solid var(--border);background:white;border-radius:9px;padding:7px 9px}
    .goal-row{display:grid;grid-template-columns:1fr 72px 72px;gap:8px;align-items:center;margin:9px 0}.goal-row.header{font-size:12px;color:var(--muted)}
    .progress-wrap{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:8px}.progress-fill{height:100%;background:#111827;border-radius:999px}
    .table-wrap{overflow-x:auto}.data-table{width:100%;border-collapse:collapse;font-size:14px}.data-table th,.data-table td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--border);white-space:nowrap}.data-table th{color:var(--muted);font-weight:600;font-size:12px}
    .tabs{display:flex;gap:8px;overflow-x:auto;margin:14px 0}.tab{border:1px solid var(--border);background:white;border-radius:999px;padding:9px 12px;white-space:nowrap}.tab.active{background:var(--primary);color:white;border-color:var(--primary)}
    .chart{width:100%;height:auto;display:block}.chart-label{font-size:11px;fill:#6b7280}.chart-line{fill:none;stroke:#111827;stroke-width:2}.chart-dot{fill:#111827}.chart-grid{stroke:#e5e7eb;stroke-width:1}
    .check-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check-item{display:flex;gap:8px;align-items:center;border:1px solid var(--border);border-radius:10px;padding:9px}.check-item input{width:auto}
    .home-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.draft-card{border:2px solid #111827}
    @media(max-width:520px){.grid{grid-template-columns:1fr}.check-grid{grid-template-columns:1fr}.goal-row{grid-template-columns:1fr 64px 64px}.template-exercise{grid-template-columns:1fr auto auto auto}.app{padding-top:14px}.big-button{min-height:66px}}
  </style>
</head>
<body>
<div id="app" class="app"></div>
<script>
const STORAGE_KEY = 'gymTrackerData';
const DRAFT_KEY = 'gymTrackerDraft';
const DATA_VERSION = 2; // App build 2.2; storage schema unchanged

const MUSCLES = [
  ['chest','Chest',true],['lats','Lats',true],['upper-back','Upper Back',true],['traps','Traps',false],
  ['front-delts','Front Delts',true],['side-delts','Side Delts',true],['rear-delts','Rear Delts',true],
  ['biceps','Biceps',true],['triceps','Triceps',true],['forearms','Forearms',false],
  ['quads','Quads',true],['hamstrings','Hamstrings',true],['glutes','Glutes',true],['adductors','Adductors',false],
  ['calves','Calves',true],['core','Abs / Core',false]
].map(([id,name,tracked])=>({id,name,tracked}));

const SUGGESTED_EXERCISES = [
  ['Barbell Bench Press',['chest'],['triceps','front-delts']],['Dumbbell Bench Press',['chest'],['triceps','front-delts']],['Machine Chest Press',['chest'],['triceps','front-delts']],['Smith Machine Bench Press',['chest'],['triceps','front-delts']],
  ['Incline Barbell Bench Press',['chest'],['front-delts','triceps']],['Incline Dumbbell Press',['chest'],['front-delts','triceps']],['Incline Machine Chest Press',['chest'],['front-delts','triceps']],
  ['Cable Fly',['chest'],[]],['High-to-Low Cable Fly',['chest'],[]],['Low-to-High Cable Fly',['chest'],['front-delts']],['Pec Deck',['chest'],[]],['Dumbbell Fly',['chest'],[]],['Chest Dip',['chest'],['triceps','front-delts']],['Push-Up',['chest'],['triceps','front-delts']],
  ['Lat Pulldown',['lats'],['biceps','upper-back']],['Neutral-Grip Lat Pulldown',['lats'],['biceps','upper-back']],['Wide-Grip Lat Pulldown',['lats'],['biceps','upper-back']],['Single-Arm Cable Pulldown',['lats'],['biceps']],['Straight-Arm Pulldown',['lats'],[]],['Pull-Up',['lats'],['biceps','upper-back']],['Assisted Pull-Up',['lats'],['biceps','upper-back']],['Chin-Up',['lats'],['biceps']],
  ['Seated Cable Row',['upper-back'],['lats','biceps','rear-delts']],['Chest-Supported Dumbbell Row',['upper-back'],['lats','biceps','rear-delts']],['Machine Row',['upper-back'],['lats','biceps','rear-delts']],['T-Bar Row',['upper-back'],['lats','biceps','rear-delts']],['Barbell Row',['upper-back'],['lats','biceps','rear-delts']],['Single-Arm Dumbbell Row',['lats'],['upper-back','biceps']],['High Row Machine',['upper-back'],['lats','biceps','rear-delts']],
  ['Barbell Overhead Press',['front-delts'],['triceps','side-delts']],['Dumbbell Shoulder Press',['front-delts'],['triceps','side-delts']],['Machine Shoulder Press',['front-delts'],['triceps','side-delts']],['Smith Machine Shoulder Press',['front-delts'],['triceps','side-delts']],
  ['Dumbbell Lateral Raise',['side-delts'],[]],['Cable Lateral Raise',['side-delts'],[]],['Machine Lateral Raise',['side-delts'],[]],['Reverse Pec Deck',['rear-delts'],['upper-back']],['Cable Rear Delt Fly',['rear-delts'],['upper-back']],['Face Pull',['rear-delts'],['upper-back']],
  ['Dumbbell Biceps Curl',['biceps'],['forearms']],['Cable Biceps Curl',['biceps'],['forearms']],['EZ-Bar Curl',['biceps'],['forearms']],['Barbell Curl',['biceps'],['forearms']],['Incline Dumbbell Curl',['biceps'],[]],['Preacher Curl',['biceps'],[]],['Machine Biceps Curl',['biceps'],[]],['Hammer Curl',['biceps'],['forearms']],['Bayesian Cable Curl',['biceps'],[]],
  ['Cable Triceps Pressdown',['triceps'],[]],['Rope Triceps Pressdown',['triceps'],[]],['Overhead Cable Triceps Extension',['triceps'],[]],['Dumbbell Overhead Triceps Extension',['triceps'],[]],['Skull Crusher',['triceps'],[]],['Close-Grip Bench Press',['triceps'],['chest','front-delts']],['Triceps Dip',['triceps'],['chest','front-delts']],
  ['Back Squat',['quads'],['glutes','adductors']],['Front Squat',['quads'],['glutes']],['Hack Squat',['quads'],['glutes']],['Smith Machine Squat',['quads'],['glutes']],['Leg Press',['quads'],['glutes']],['Leg Extension',['quads'],[]],['Bulgarian Split Squat',['quads'],['glutes']],['Walking Lunge',['quads'],['glutes']],['Reverse Lunge',['glutes'],['quads']],['Step-Up',['glutes'],['quads']],
  ['Romanian Deadlift',['hamstrings'],['glutes']],['Stiff-Leg Deadlift',['hamstrings'],['glutes']],['Seated Leg Curl',['hamstrings'],[]],['Lying Leg Curl',['hamstrings'],[]],['Standing Leg Curl',['hamstrings'],[]],['Nordic Hamstring Curl',['hamstrings'],[]],
  ['Barbell Hip Thrust',['glutes'],['hamstrings']],['Machine Hip Thrust',['glutes'],['hamstrings']],['Glute Bridge',['glutes'],['hamstrings']],['Cable Pull-Through',['glutes'],['hamstrings']],['45-Degree Back Extension',['glutes'],['hamstrings']],['Hip Abduction Machine',['glutes'],[]],['Hip Adduction Machine',['adductors'],[]],
  ['Standing Calf Raise',['calves'],[]],['Seated Calf Raise',['calves'],[]],['Leg Press Calf Raise',['calves'],[]],['Single-Leg Calf Raise',['calves'],[]],
  ['Dumbbell Shrug',['traps'],[]],['Machine Shrug',['traps'],[]],['Barbell Shrug',['traps'],[]],['Wrist Curl',['forearms'],[]],['Reverse Wrist Curl',['forearms'],[]],
  ['Cable Crunch',['core'],[]],['Hanging Leg Raise',['core'],[]],['Ab Wheel Rollout',['core'],[]],['Plank',['core'],[]]
].map(([name,primaryMuscles,secondaryMuscles])=>({id:'suggested-'+slug(name),name,primaryMuscles,secondaryMuscles}));

function slug(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function uid(){return (crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2))}
function clone(x){return JSON.parse(JSON.stringify(x))}
function escapeHTML(v=''){return String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function todayString(){const d=new Date();const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function fmtDate(s){if(!s)return '';return new Date(s+'T12:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}
function muscleName(id){return MUSCLES.find(m=>m.id===id)?.name||id}

function defaultMuscleGoals(){const o={};MUSCLES.forEach(m=>o[m.id]={tracked:m.tracked,min:5,target:10});return o}
function baseExercise(id,name,primaryMuscles=[],secondaryMuscles=[]){return {id,name,note:'',primaryMuscles,secondaryMuscles,archived:false}}
function makeDefaults(){
  const exercises={
    'leg-press':baseExercise('leg-press','Leg Press',['quads'],['glutes']),
    'split-squat':baseExercise('split-squat','Bulgarian Split Squat',['quads'],['glutes']),
    'leg-curl':baseExercise('leg-curl','Leg Curl',['hamstrings'],[]),
    'calf-raise':baseExercise('calf-raise','Calf Raise',['calves'],[]),
    'cable-row':baseExercise('cable-row','Cable Row',['upper-back'],['lats','biceps','rear-delts']),
    'lat-pulldown':baseExercise('lat-pulldown','Lat Pulldown',['lats'],['biceps','upper-back']),
    'chest-press':baseExercise('chest-press','Chest Press',['chest'],['triceps','front-delts']),
    'biceps-curl':baseExercise('biceps-curl','Biceps Curl',['biceps'],['forearms'])
  };
  return {version:DATA_VERSION,settings:{secondarySetWeight:.5},muscleGoals:defaultMuscleGoals(),exercises,templates:{
    upperA:{id:'upperA',name:'Upper A',exercises:['chest-press','lat-pulldown','cable-row','biceps-curl']},
    upperB:{id:'upperB',name:'Upper B',exercises:['lat-pulldown','chest-press','cable-row']},
    legs:{id:'legs',name:'Legs',exercises:['leg-press','split-squat','leg-curl','calf-raise']}
  },workouts:[]};
}

function guessMuscles(name){
  const n=name.toLowerCase();
  const exact=SUGGESTED_EXERCISES.find(e=>e.name.toLowerCase()===n); if(exact)return {primaryMuscles:[...exact.primaryMuscles],secondaryMuscles:[...exact.secondaryMuscles]};
  if(/calf/.test(n))return {primaryMuscles:['calves'],secondaryMuscles:[]};
  if(/leg extension/.test(n))return {primaryMuscles:['quads'],secondaryMuscles:[]};
  if(/leg curl|nordic/.test(n))return {primaryMuscles:['hamstrings'],secondaryMuscles:[]};
  if(/hip thrust|glute bridge|abduction/.test(n))return {primaryMuscles:['glutes'],secondaryMuscles:[]};
  if(/adduct/.test(n))return {primaryMuscles:['adductors'],secondaryMuscles:[]};
  if(/squat|leg press|lunge|split squat/.test(n))return {primaryMuscles:['quads'],secondaryMuscles:['glutes']};
  if(/romanian|rdl|stiff-leg/.test(n))return {primaryMuscles:['hamstrings'],secondaryMuscles:['glutes']};
  if(/lateral raise/.test(n))return {primaryMuscles:['side-delts'],secondaryMuscles:[]};
  if(/rear delt|reverse fly|reverse pec|face pull/.test(n))return {primaryMuscles:['rear-delts'],secondaryMuscles:['upper-back']};
  if(/shoulder press|overhead press/.test(n))return {primaryMuscles:['front-delts'],secondaryMuscles:['triceps','side-delts']};
  if(/curl/.test(n))return {primaryMuscles:['biceps'],secondaryMuscles:/hammer|reverse/.test(n)?['forearms']:[]};
  if(/tricep|pressdown|skull/.test(n))return {primaryMuscles:['triceps'],secondaryMuscles:[]};
  if(/pulldown|pull-up|pullup|chin-up/.test(n))return {primaryMuscles:['lats'],secondaryMuscles:['biceps','upper-back']};
  if(/row/.test(n))return {primaryMuscles:['upper-back'],secondaryMuscles:['lats','biceps','rear-delts']};
  if(/bench|chest press|fly|pec deck|push-up/.test(n))return {primaryMuscles:['chest'],secondaryMuscles:['triceps','front-delts']};
  if(/shrug/.test(n))return {primaryMuscles:['traps'],secondaryMuscles:[]};
  if(/wrist|forearm/.test(n))return {primaryMuscles:['forearms'],secondaryMuscles:[]};
  if(/crunch|plank|ab wheel|leg raise/.test(n))return {primaryMuscles:['core'],secondaryMuscles:[]};
  return {primaryMuscles:[],secondaryMuscles:[]};
}

function migrate(raw){
  const defaults=makeDefaults(); if(!raw||typeof raw!=='object')return defaults;
  raw.version=DATA_VERSION; raw.settings={...defaults.settings,...(raw.settings||{})}; raw.muscleGoals={...defaults.muscleGoals,...(raw.muscleGoals||{})};
  raw.exercises=raw.exercises||{}; Object.values(raw.exercises).forEach(ex=>{const g=guessMuscles(ex.name||''); if(!Array.isArray(ex.primaryMuscles))ex.primaryMuscles=g.primaryMuscles;if(!Array.isArray(ex.secondaryMuscles))ex.secondaryMuscles=g.secondaryMuscles;if(typeof ex.note!=='string')ex.note='';if(typeof ex.archived!=='boolean')ex.archived=false});
  raw.templates=raw.templates||{}; raw.workouts=Array.isArray(raw.workouts)?raw.workouts:[]; return raw;
}
function loadData(){try{return migrate(JSON.parse(localStorage.getItem(STORAGE_KEY)))}catch{return makeDefaults()}}
function saveData(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}
function loadDraft(){try{return JSON.parse(localStorage.getItem(DRAFT_KEY))}catch{return null}}
function saveDraft(){if(currentWorkout)localStorage.setItem(DRAFT_KEY,JSON.stringify(currentWorkout))}
function clearDraft(){localStorage.removeItem(DRAFT_KEY)}
let data=loadData(); let currentWorkout=null; saveData();

function getExercise(id){return data.exercises[id]}
function workoutSortValue(w){return `${w.date||''}|${w.createdAt||''}`}
function latestEntry(exerciseId){return [...data.workouts].sort((a,b)=>workoutSortValue(b).localeCompare(workoutSortValue(a))).map(w=>({w,e:w.exercises.find(x=>x.exerciseId===exerciseId)})).find(x=>x.e)||null}
function starterSets(exerciseId){const last=latestEntry(exerciseId);if(!last||!last.e.sets?.length)return [{weight:'',reps:''}];return last.e.sets.map(s=>({weight:String(s.weight??''),reps:''}))}
function lastText(exerciseId){const x=latestEntry(exerciseId);if(!x)return 'No previous data';return x.e.sets.map(s=>`${s.weight} kg × ${s.reps}`).join(' · ')}
function bestRepsAtWeight(exerciseId,weight,excludeWorkoutId=null){let best=null;for(const w of data.workouts){if(w.id===excludeWorkoutId)continue;for(const e of w.exercises){if(e.exerciseId!==exerciseId)continue;for(const s of e.sets){if(Number(s.weight)===Number(weight))best=Math.max(best??0,Number(s.reps))}}}return best}

function createWorkout(name,templateId=null,date=todayString()){return {id:uid(),name,templateId,date,createdAt:new Date().toISOString(),exercises:[]}}
function safeStart(makeWorkout){const d=loadDraft();if(d){if(!confirm('You already have a workout in progress. Start a new one and discard that draft?')){currentWorkout=d;renderWorkout();return}clearDraft()}currentWorkout=makeWorkout();saveDraft();renderWorkout()}
function startTemplate(id){const t=data.templates[id];if(!t)return;safeStart(()=>{const w=createWorkout(t.name,id);w.exercises=t.exercises.map(exerciseId=>({exerciseId,sets:starterSets(exerciseId)}));return w})}
function startCustom(){safeStart(()=>createWorkout('Custom Workout'))}
function startPastWorkout(){safeStart(()=>createWorkout('Past Workout',null,todayString()))}
function resumeDraft(){currentWorkout=loadDraft();if(currentWorkout)renderWorkout();else renderHome()}
function leaveWorkout(){saveDraft();currentWorkout=null;renderHome()}

function renderHome(){currentWorkout=null;const draft=loadDraft();const templates=Object.values(data.templates);document.getElementById('app').innerHTML=`
  <div class="home-top"><div><h1>Gym Tracker</h1><div class="subtitle">Train consistently. Track clean progress.</div></div></div>
  ${draft?`<div class="card draft-card"><div class="row space-between"><div><strong>Workout in progress</strong><div class="muted">${escapeHTML(draft.name)} · ${fmtDate(draft.date)}</div></div><button class="small-button primary" onclick="resumeDraft()">Resume</button></div></div>`:''}
  <div class="grid">${templates.map(t=>`<button class="big-button primary" onclick="startTemplate('${t.id}')">${escapeHTML(t.name)}</button>`).join('')}
    <button class="big-button" onclick="startCustom()">Custom Workout</button><button class="big-button" onclick="startPastWorkout()">Log Past Workout</button>
  </div>
  <div class="section grid"><button class="big-button" onclick="renderProgress('volume')">Progress & Volume</button><button class="big-button" onclick="renderTemplates()">Manage Templates</button><button class="big-button" onclick="renderExerciseLibrary()">Exercise Library</button><button class="big-button" onclick="renderDataTools()">Backup & Export</button></div>`}

function renderWorkout(){if(!currentWorkout){renderHome();return}document.getElementById('app').innerHTML=`
  <button class="back" onclick="leaveWorkout()">← Home (save draft)</button>
  <div class="row space-between"><div><h2 style="margin-bottom:4px">${escapeHTML(currentWorkout.name)}</h2><div class="muted">Standard effort: approximately 1 rep in reserve</div></div></div>
  <div class="card" style="margin-top:18px"><label class="muted">Workout date</label><input type="date" value="${currentWorkout.date}" oninput="updateWorkoutDate(this.value)"></div>
  <div id="exerciseList"></div><button class="add-button" onclick="showExercisePicker(addExerciseToWorkout)">+ Add exercise</button>
  <button class="finish" onclick="finishWorkout()">Finish workout</button>`;renderExercises()}
function updateWorkoutDate(v){currentWorkout.date=v;saveDraft()}
function renderExercises(){const list=document.getElementById('exerciseList');if(!list)return;list.innerHTML=currentWorkout.exercises.map((entry,ei)=>{const ex=getExercise(entry.exerciseId)||{name:'Unknown exercise',note:'',primaryMuscles:[],secondaryMuscles:[]};const tags=[...(ex.primaryMuscles||[]).map(m=>`<span class="pill primary">${escapeHTML(muscleName(m))}</span>`),...(ex.secondaryMuscles||[]).map(m=>`<span class="pill secondary">${escapeHTML(muscleName(m))} ½</span>`)];return `<div class="card"><div class="row space-between"><div><div class="exercise-title">${escapeHTML(ex.name)}</div><div class="muted" style="margin-top:4px">Last time: ${escapeHTML(lastText(entry.exerciseId))}</div><div style="margin-top:5px">${tags.join('')}</div></div><button class="delete-button" onclick="removeExercise(${ei})">×</button></div>
  <div class="note"><strong>Note:</strong> ${ex.note?escapeHTML(ex.note):'No persistent note yet.'} <button class="small-button" style="margin-left:6px" onclick="editNote('${entry.exerciseId}')">Edit</button></div>
  <div style="margin-top:14px"><div class="set-row muted"><div>Set</div><div>Weight kg</div><div>Reps</div><div></div></div>
  ${entry.sets.map((s,si)=>{const prev=bestRepsAtWeight(entry.exerciseId,s.weight);const pr=s.weight!==''&&s.reps!==''&&prev!==null&&Number(s.reps)>prev;return `<div class="set-row"><div>${si+1}</div><input inputmode="decimal" placeholder="kg" value="${escapeHTML(s.weight)}" oninput="updateSet(${ei},${si},'weight',this.value)"><input inputmode="numeric" placeholder="reps" value="${escapeHTML(s.reps)}" oninput="updateSet(${ei},${si},'reps',this.value)"><button class="delete-button" onclick="removeSet(${ei},${si})">×</button></div>${pr?`<div class="success">New rep PR at ${escapeHTML(s.weight)} kg</div>`:''}`}).join('')}
  <button class="add-button" onclick="addSet(${ei})">+ Add set</button></div></div>`}).join('')}
function updateSet(ei,si,field,value){currentWorkout.exercises[ei].sets[si][field]=value;saveDraft()}
function addSet(ei){const e=currentWorkout.exercises[ei],prev=e.sets.at(-1);e.sets.push({weight:prev?.weight||'',reps:''});saveDraft();renderExercises()}
function removeSet(ei,si){const e=currentWorkout.exercises[ei];e.sets.splice(si,1);if(!e.sets.length)e.sets.push({weight:'',reps:''});saveDraft();renderExercises()}
function removeExercise(i){currentWorkout.exercises.splice(i,1);saveDraft();renderExercises()}
function addExerciseToWorkout(ex){if(currentWorkout.exercises.some(e=>e.exerciseId===ex.id)&&!confirm(`${ex.name} is already in this workout. Add it again?`))return;currentWorkout.exercises.push({exerciseId:ex.id,sets:starterSets(ex.id)});saveDraft();renderExercises()}
function editNote(id){const ex=getExercise(id);const v=prompt('Persistent note for '+ex.name,ex.note||'');if(v===null)return;ex.note=v.trim();saveData();renderExercises()}

function showExercisePicker(onSelect){
  const backdrop=document.createElement('div');
  backdrop.className='modal-backdrop';
  backdrop.innerHTML=`<div class="modal">
    <div class="row space-between">
      <h2>Add exercise</h2>
      <button class="delete-button" id="closePick">×</button>
    </div>
    <div class="muted">Search your exercise library or choose from suggested exercises.</div>
    <input id="exerciseSearch" class="search" placeholder="Search e.g. bicep, cable, row…" autocomplete="off">
    <div id="exerciseResults"></div>
    <div class="divider"></div>
    <button class="add-button" id="createCustom">+ Create a new exercise</button>
  </div>`;
  document.body.appendChild(backdrop);

  const input=backdrop.querySelector('#exerciseSearch');
  const results=backdrop.querySelector('#exerciseResults');
  const modal=backdrop.querySelector('.modal');

  function draw(){
    const q=input.value.trim().toLowerCase();
    const library=Object.values(data.exercises)
      .filter(e=>!e.archived&&(!q||e.name.toLowerCase().includes(q)))
      .sort((a,b)=>a.name.localeCompare(b.name));
    const libraryNames=new Set(Object.values(data.exercises).map(e=>e.name.toLowerCase()));
    const suggestions=SUGGESTED_EXERCISES
      .filter(e=>!libraryNames.has(e.name.toLowerCase())&&(!q||e.name.toLowerCase().includes(q)))
      .slice(0,40);

    results.innerHTML=`${library.length?`<div class="muted" style="margin:6px 0">YOUR EXERCISES</div>${library.map(e=>exercisePickerButton(e,false)).join('')}`:''}${suggestions.length?`<div class="muted" style="margin:12px 0 6px">SUGGESTED</div>${suggestions.map(e=>exercisePickerButton(e,true)).join('')}`:''}${!library.length&&!suggestions.length?'<div class="card">No matches. Create a new exercise below.</div>':''}`;

    results.querySelectorAll('[data-ex-id]').forEach(btn=>btn.onclick=()=>{
      const id=btn.dataset.exId;
      const isSuggested=btn.dataset.suggested==='1';
      let ex;
      if(isSuggested){
        const s=SUGGESTED_EXERCISES.find(x=>x.id===id);
        ex=addSuggestedToLibrary(s);
      }else{
        ex=data.exercises[id];
      }
      backdrop.remove();
      onSelect(ex);
    });

    const typed=input.value.trim();
    const exactExisting=Object.values(data.exercises).find(e=>e.name.toLowerCase()===typed.toLowerCase());
    const createButton=backdrop.querySelector('#createCustom');
    if(createButton){
      createButton.textContent=typed
        ? (exactExisting ? `Use “${exactExisting.name}”` : `+ Create “${typed}”`)
        : '+ Create a new exercise';
    }
  }

  function showCreateForm(prefill=''){
    const guessed=guessMuscles(prefill);
    modal.innerHTML=`
      <div class="row space-between">
        <h2>Create exercise</h2>
        <button class="delete-button" id="closeCreate">×</button>
      </div>
      <div class="muted">Name the exercise and choose which muscles should count toward your weekly totals.</div>

      <label class="muted" style="display:block;margin-top:14px">Exercise name</label>
      <input id="newExerciseName" value="${escapeHTML(prefill)}" autocomplete="off">

      <div class="divider"></div>
      <h3>Primary muscles <span class="muted">(1 set each)</span></h3>
      <div class="check-grid" id="newPrimaryChecks">${muscleChecks(guessed.primaryMuscles||[],'new-p')}</div>

      <h3 style="margin-top:16px">Secondary muscles <span class="muted">(½ set each)</span></h3>
      <div class="check-grid" id="newSecondaryChecks">${muscleChecks(guessed.secondaryMuscles||[],'new-s')}</div>

      <div class="row" style="margin-top:18px">
        <button class="small-button primary" id="saveNewExercise">Create & add</button>
        <button class="small-button" id="cancelCreate">Back</button>
      </div>`;

    const nameInput=modal.querySelector('#newExerciseName');
    modal.querySelector('#closeCreate').onclick=()=>backdrop.remove();
    modal.querySelector('#cancelCreate').onclick=()=>{
      backdrop.remove();
      showExercisePicker(onSelect);
    };

    modal.querySelector('#saveNewExercise').onclick=()=>{
      const name=nameInput.value.trim();
      if(!name){
        alert('Please enter an exercise name.');
        nameInput.focus();
        return;
      }

      const existing=Object.values(data.exercises).find(e=>e.name.toLowerCase()===name.toLowerCase());
      if(existing){
        if(existing.archived) existing.archived=false;
        saveData();
        backdrop.remove();
        onSelect(existing);
        return;
      }

      const primary=[...modal.querySelectorAll('input[data-kind="new-p"]:checked')].map(x=>x.value);
      const secondary=[...modal.querySelectorAll('input[data-kind="new-s"]:checked')]
        .map(x=>x.value)
        .filter(x=>!primary.includes(x));

      const ex=baseExercise(uid(),name,primary,secondary);
      data.exercises[ex.id]=ex;
      saveData();
      backdrop.remove();
      onSelect(ex);
    };

    setTimeout(()=>nameInput.focus(),50);
  }

  input.addEventListener('input',draw);
  backdrop.querySelector('#closePick').onclick=()=>backdrop.remove();
  backdrop.addEventListener('click',e=>{if(e.target===backdrop)backdrop.remove()});
  backdrop.querySelector('#createCustom').onclick=()=>{
    const typed=input.value.trim();
    const existing=Object.values(data.exercises).find(e=>e.name.toLowerCase()===typed.toLowerCase());
    if(typed&&existing){
      backdrop.remove();
      onSelect(existing);
      return;
    }
    showCreateForm(typed);
  };

  draw();
  setTimeout(()=>input.focus(),50);
}
function exercisePickerButton(e,suggested){const tags=[...(e.primaryMuscles||[]).map(m=>muscleName(m)),...(e.secondaryMuscles||[]).map(m=>muscleName(m)+' ½')].join(' · ');return `<button class="list-button" data-ex-id="${e.id}" data-suggested="${suggested?'1':'0'}"><strong>${escapeHTML(e.name)}</strong>${tags?`<div class="muted" style="margin-top:3px">${escapeHTML(tags)}</div>`:''}</button>`}
function addSuggestedToLibrary(s){const ex=baseExercise(uid(),s.name,[...s.primaryMuscles],[...s.secondaryMuscles]);data.exercises[ex.id]=ex;saveData();return ex}

function validateWorkout(){const p=[];currentWorkout.exercises.forEach(entry=>{const ex=getExercise(entry.exerciseId);entry.sets.forEach((s,i)=>{if(String(s.weight).trim()===''||String(s.reps).trim()==='')p.push(`${ex?.name||'Exercise'}, set ${i+1}`);else if(Number(s.weight)<0||Number(s.reps)<=0||!Number.isFinite(Number(s.weight))||!Number.isFinite(Number(s.reps)))p.push(`${ex?.name||'Exercise'}, set ${i+1} (invalid number)`)})});return p}
function finishWorkout(){if(!currentWorkout.exercises.length){alert('Add at least one exercise before saving.');return}const p=validateWorkout();if(p.length){alert('This workout has incomplete or invalid sets.\n\n'+p.join('\n')+'\n\nAdd the missing weight/reps or delete the set before finishing.');return}const finished=clone(currentWorkout);data.workouts.push(finished);saveData();clearDraft();const summary=getWorkoutSummary(finished);currentWorkout=null;document.getElementById('app').innerHTML=`<h1>Workout complete</h1><div class="card"><strong>${escapeHTML(finished.name)}</strong><div class="muted" style="margin-top:5px">${fmtDate(finished.date)}</div></div>${summary.length?`<div class="card"><h2>Progress</h2>${summary.map(x=>`<div class="success">${escapeHTML(x)}</div>`).join('')}</div>`:'<div class="card">Workout saved.</div>'}<button class="finish" onclick="renderHome()">Done</button>`}
function getWorkoutSummary(w){const out=[];for(const e of w.exercises){const ex=getExercise(e.exerciseId);for(const s of e.sets){const prev=bestRepsAtWeight(e.exerciseId,s.weight,w.id);if(prev!==null&&Number(s.reps)>prev)out.push(`${ex.name}: ${s.weight} kg × ${s.reps} — new rep PR`)} }return [...new Set(out)]}

function renderExerciseLibrary(){const exercises=Object.values(data.exercises).filter(e=>!e.archived).sort((a,b)=>a.name.localeCompare(b.name));document.getElementById('app').innerHTML=`<button class="back" onclick="renderHome()">← Home</button><h1>Exercise Library</h1><div class="subtitle">Names, persistent notes and muscle-group set counting all live here.</div><input id="libSearch" class="search" placeholder="Search exercises…" oninput="filterLibrary(this.value)"><div id="libraryList">${exerciseLibraryHTML(exercises)}</div><button class="add-button" onclick="showExercisePicker(()=>renderExerciseLibrary())">+ Add exercise</button>`}
function exerciseLibraryHTML(arr){return arr.map(e=>`<div class="card library-entry" data-name="${escapeHTML(e.name.toLowerCase())}"><div class="row space-between"><div><strong>${escapeHTML(e.name)}</strong><div style="margin-top:5px">${(e.primaryMuscles||[]).map(m=>`<span class="pill primary">${escapeHTML(muscleName(m))}</span>`).join('')}${(e.secondaryMuscles||[]).map(m=>`<span class="pill secondary">${escapeHTML(muscleName(m))} ½</span>`).join('')}</div>${e.note?`<div class="muted" style="margin-top:6px">${escapeHTML(e.note)}</div>`:''}</div><button class="small-button" onclick="editExercise('${e.id}')">Edit</button></div></div>`).join('')}
function filterLibrary(q){q=q.toLowerCase();document.querySelectorAll('.library-entry').forEach(el=>el.style.display=el.dataset.name.includes(q)?'block':'none')}
function editExercise(id){const ex=getExercise(id);if(!ex)return;const b=document.createElement('div');b.className='modal-backdrop';b.innerHTML=`<div class="modal"><div class="row space-between"><h2>Edit exercise</h2><button class="delete-button" id="x">×</button></div><label class="muted">Exercise name</label><input id="exName" value="${escapeHTML(ex.name)}"><label class="muted" style="display:block;margin-top:12px">Persistent note</label><textarea id="exNote">${escapeHTML(ex.note||'')}</textarea><div class="divider"></div><h3>Primary muscles <span class="muted">(1 set each)</span></h3><div class="check-grid" id="primaryChecks">${muscleChecks(ex.primaryMuscles||[],'p')}</div><h3 style="margin-top:16px">Secondary muscles <span class="muted">(½ set each)</span></h3><div class="check-grid" id="secondaryChecks">${muscleChecks(ex.secondaryMuscles||[],'s')}</div><div class="row" style="margin-top:18px"><button class="small-button primary" id="save">Save</button><button class="small-button" id="archive">Archive</button></div></div>`;document.body.appendChild(b);b.querySelector('#x').onclick=()=>b.remove();b.querySelector('#save').onclick=()=>{const name=b.querySelector('#exName').value.trim();if(!name){alert('Exercise name cannot be blank.');return}const p=[...b.querySelectorAll('input[data-kind="p"]:checked')].map(x=>x.value);let s=[...b.querySelectorAll('input[data-kind="s"]:checked')].map(x=>x.value).filter(x=>!p.includes(x));ex.name=name;ex.note=b.querySelector('#exNote').value.trim();ex.primaryMuscles=p;ex.secondaryMuscles=s;saveData();b.remove();renderExerciseLibrary()};b.querySelector('#archive').onclick=()=>{if(confirm('Archive this exercise? Its workout history will be kept.')){ex.archived=true;saveData();b.remove();renderExerciseLibrary()}}}
function muscleChecks(selected,kind){return MUSCLES.map(m=>`<label class="check-item"><input type="checkbox" data-kind="${kind}" value="${m.id}" ${selected.includes(m.id)?'checked':''}> ${escapeHTML(m.name)}</label>`).join('')}

function renderTemplates(){const ts=Object.values(data.templates);document.getElementById('app').innerHTML=`<button class="back" onclick="renderHome()">← Home</button><h1>Templates</h1><div class="subtitle">Create as many as you want, rename them and permanently change their exercises.</div>${ts.map(t=>`<div class="card"><div class="row space-between"><div><strong>${escapeHTML(t.name)}</strong><div class="muted">${t.exercises.length} exercises</div></div><div class="row"><button class="small-button" onclick="renameTemplate('${t.id}')">Rename</button><button class="small-button primary" onclick="editTemplate('${t.id}')">Edit</button></div></div></div>`).join('')}<button class="add-button" onclick="createTemplate()">+ New template</button>`}
function createTemplate(){const name=prompt('Template name:');if(!name||!name.trim())return;const id=uid();data.templates[id]={id,name:name.trim(),exercises:[]};saveData();editTemplate(id)}
function renameTemplate(id){const t=data.templates[id],name=prompt('Template name:',t.name);if(!name||!name.trim())return;t.name=name.trim();saveData();renderTemplates()}
function editTemplate(id){const t=data.templates[id];if(!t){renderTemplates();return}document.getElementById('app').innerHTML=`<button class="back" onclick="renderTemplates()">← Templates</button><div class="row space-between"><div><h1>${escapeHTML(t.name)}</h1><div class="subtitle">Changes here affect future workouts only.</div></div></div><div class="card">${t.exercises.length?t.exercises.map((eid,i)=>{const ex=getExercise(eid);return `<div class="template-exercise"><strong>${escapeHTML(ex?.name||'Unknown')}</strong><button class="icon-button" onclick="moveTemplateExercise('${id}',${i},-1)" ${i===0?'disabled':''}>↑</button><button class="icon-button" onclick="moveTemplateExercise('${id}',${i},1)" ${i===t.exercises.length-1?'disabled':''}>↓</button><button class="delete-button" onclick="removeTemplateExercise('${id}',${i})">×</button></div>`}).join(''):'<div class="muted">No exercises yet.</div>'}<button class="add-button" onclick="showExercisePicker(ex=>addTemplateExercise('${id}',ex))">+ Add exercise</button></div><button class="small-button" style="width:100%;color:var(--danger)" onclick="deleteTemplate('${id}')">Delete template</button>`}
function addTemplateExercise(id,ex){data.templates[id].exercises.push(ex.id);saveData();editTemplate(id)}
function removeTemplateExercise(id,i){data.templates[id].exercises.splice(i,1);saveData();editTemplate(id)}
function moveTemplateExercise(id,i,d){const a=data.templates[id].exercises,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];saveData();editTemplate(id)}
function deleteTemplate(id){if(!confirm('Delete this template? Saved workouts will not be affected.'))return;delete data.templates[id];saveData();renderTemplates()}

function renderProgress(tab='volume'){document.getElementById('app').innerHTML=`<button class="back" onclick="renderHome()">← Home</button><h1>Progress & Volume</h1><div class="tabs"><button class="tab ${tab==='volume'?'active':''}" onclick="renderProgress('volume')">Weekly sets</button><button class="tab ${tab==='exercise'?'active':''}" onclick="renderProgress('exercise')">Exercise progress</button><button class="tab ${tab==='history'?'active':''}" onclick="renderProgress('history')">Workout history</button></div><div id="progressContent"></div>`;if(tab==='volume')renderVolumeDashboard();if(tab==='exercise')renderExerciseProgress();if(tab==='history')renderWorkoutHistory()}
function mondayOf(dateString){const d=new Date(dateString+'T12:00:00');const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d.toISOString().slice(0,10)}
function addDays(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function weeklySetCounts(weekStart){const end=addDays(weekStart,6),counts={};MUSCLES.forEach(m=>counts[m.id]=0);for(const w of data.workouts){if(w.date<weekStart||w.date>end)continue;for(const entry of w.exercises){const ex=getExercise(entry.exerciseId);if(!ex)continue;const n=entry.sets.length;(ex.primaryMuscles||[]).forEach(m=>counts[m]=(counts[m]||0)+n);(ex.secondaryMuscles||[]).forEach(m=>counts[m]=(counts[m]||0)+n*Number(data.settings.secondarySetWeight||.5))}}return counts}
function renderVolumeDashboard(){const current=mondayOf(todayString()),counts=weeklySetCounts(current),tracked=MUSCLES.filter(m=>data.muscleGoals[m.id]?.tracked);let html=`<div class="card"><div class="row space-between"><div><strong>This week</strong><div class="muted">${fmtDate(current)} – ${fmtDate(addDays(current,6))}</div></div><button class="small-button" onclick="renderMuscleGoals()">Edit goals</button></div><div class="muted" style="margin-top:10px">Primary muscle sets count as 1; secondary muscle sets count as ${data.settings.secondarySetWeight||.5}. Targets are editable starting points.</div></div>`;
  html+=tracked.map(m=>{const g=data.muscleGoals[m.id],v=counts[m.id]||0,p=Math.min(100,g.target?100*v/g.target:0);return `<div class="card"><div class="row space-between"><strong>${escapeHTML(m.name)}</strong><strong>${formatSets(v)} / ${g.target}</strong></div><div class="progress-wrap"><div class="progress-fill" style="width:${p}%"></div></div><div class="muted" style="margin-top:6px">Minimum ${g.min} · Target ${g.target} sets/week</div></div>`}).join('');
  const weeks=Array.from({length:8},(_,i)=>addDays(current,-7*(7-i)));html+=`<div class="card"><h2>Last 8 weeks</h2><div class="table-wrap"><table class="data-table"><thead><tr><th>Week</th>${tracked.map(m=>`<th>${escapeHTML(m.name)}</th>`).join('')}</tr></thead><tbody>${weeks.map(w=>{const c=weeklySetCounts(w);return `<tr><td>${fmtDate(w)}</td>${tracked.map(m=>`<td>${formatSets(c[m.id]||0)}</td>`).join('')}</tr>`}).join('')}</tbody></table></div></div>`;document.getElementById('progressContent').innerHTML=html}
function formatSets(v){return Number.isInteger(v)?String(v):Number(v).toFixed(1)}
function renderMuscleGoals(){document.getElementById('app').innerHTML=`<button class="back" onclick="renderProgress('volume')">← Weekly sets</button><h1>Muscle Goals</h1><div class="subtitle">Choose what you care about and edit your own minimum and target volumes.</div><div class="card"><div class="goal-row header"><div>Muscle</div><div>Min</div><div>Target</div></div>${MUSCLES.map(m=>{const g=data.muscleGoals[m.id];return `<div class="goal-row"><label class="row"><input style="width:auto" type="checkbox" ${g.tracked?'checked':''} onchange="setMuscleGoal('${m.id}','tracked',this.checked)"><span>${escapeHTML(m.name)}</span></label><input type="number" min="0" step="1" value="${g.min}" onchange="setMuscleGoal('${m.id}','min',this.value)"><input type="number" min="0" step="1" value="${g.target}" onchange="setMuscleGoal('${m.id}','target',this.value)"></div>`}).join('')}</div><div class="card"><strong>How sets are counted</strong><div class="muted" style="margin-top:6px">A set counts 1.0 for each primary muscle and ${data.settings.secondarySetWeight||.5} for each secondary muscle. You can change an exercise’s tags in Exercise Library.</div></div>`}
function setMuscleGoal(id,k,v){data.muscleGoals[id][k]=k==='tracked'?v:Math.max(0,Number(v)||0);saveData()}

function exerciseSessions(id){return data.workouts.filter(w=>w.exercises.some(e=>e.exerciseId===id)).sort((a,b)=>workoutSortValue(a).localeCompare(workoutSortValue(b))).map(w=>({workout:w,entry:w.exercises.find(e=>e.exerciseId===id)}))}
function sessionVolume(entry){return entry.sets.reduce((a,s)=>a+Number(s.weight)*Number(s.reps),0)}
function topSet(entry){return [...entry.sets].sort((a,b)=>Number(b.weight)-Number(a.weight)||Number(b.reps)-Number(a.reps))[0]}
function renderExerciseProgress(){const ids=[...new Set(data.workouts.flatMap(w=>w.exercises.map(e=>e.exerciseId)))].filter(id=>getExercise(id));if(!ids.length){document.getElementById('progressContent').innerHTML='<div class="card">Log some workouts and your exercise progress will appear here.</div>';return}const options=ids.sort((a,b)=>getExercise(a).name.localeCompare(getExercise(b).name)).map(id=>`<option value="${id}">${escapeHTML(getExercise(id).name)}</option>`).join('');document.getElementById('progressContent').innerHTML=`<div class="card"><label class="muted">Exercise</label><select id="progressExercise" onchange="drawExerciseProgress(this.value)">${options}</select></div><div id="exerciseProgressDetail"></div>`;drawExerciseProgress(ids[0])}
function drawExerciseProgress(id){const ex=getExercise(id),sessions=exerciseSessions(id),weights=[...new Set(sessions.flatMap(x=>x.entry.sets.map(s=>Number(s.weight))))].sort((a,b)=>a-b);const topPoints=sessions.map(x=>({date:x.workout.date,value:Number(topSet(x.entry)?.weight||0)}));const volumePoints=sessions.map(x=>({date:x.workout.date,value:sessionVolume(x.entry)}));const repRows=weights.map(w=>{let best=-1,date='';sessions.forEach(x=>x.entry.sets.forEach(s=>{if(Number(s.weight)===w&&Number(s.reps)>best){best=Number(s.reps);date=x.workout.date}}));return {w,best,date}}).filter(x=>x.best>=0).reverse();const defaultWeight=weights.at(-1);document.getElementById('exerciseProgressDetail').innerHTML=`<div class="card"><h2>${escapeHTML(ex.name)}</h2><h3>Top weight over time</h3>${simpleChart(topPoints,'kg')}<h3 style="margin-top:18px">Session volume over time</h3>${simpleChart(volumePoints,'kg·reps')}<h3 style="margin-top:18px">Clean reps at the same weight</h3>${weights.length?`<select id="repWeightSelect" onchange="drawRepWeightChart('${id}',this.value)">${[...weights].reverse().map(w=>`<option value="${w}">${w} kg</option>`).join('')}</select><div id="repWeightChart" style="margin-top:10px"></div>`:'<div class="muted">No weight data yet.</div>'}</div><div class="card"><h2>Rep PRs by weight</h2><div class="table-wrap"><table class="data-table"><thead><tr><th>Weight</th><th>Best clean reps</th><th>Date</th></tr></thead><tbody>${repRows.map(r=>`<tr><td>${r.w} kg</td><td>${r.best}</td><td>${fmtDate(r.date)}</td></tr>`).join('')}</tbody></table></div></div><div class="card"><h2>Session table</h2><div class="table-wrap"><table class="data-table"><thead><tr><th>Date</th><th>Workout</th><th>Sets</th><th>Top set</th><th>Volume</th></tr></thead><tbody>${[...sessions].reverse().map(x=>{const t=topSet(x.entry);return `<tr><td>${fmtDate(x.workout.date)}</td><td>${escapeHTML(x.workout.name)}</td><td>${escapeHTML(x.entry.sets.map(s=>`${s.weight}×${s.reps}`).join(', '))}</td><td>${t?`${t.weight}×${t.reps}`:''}</td><td>${Math.round(sessionVolume(x.entry))}</td></tr>`}).join('')}</tbody></table></div></div>`;if(defaultWeight!==undefined)drawRepWeightChart(id,defaultWeight)}
function drawRepWeightChart(id,weight){const points=exerciseSessions(id).map(x=>{const reps=x.entry.sets.filter(s=>Number(s.weight)===Number(weight)).map(s=>Number(s.reps));return reps.length?{date:x.workout.date,value:Math.max(...reps)}:null}).filter(Boolean);const target=document.getElementById('repWeightChart');if(target)target.innerHTML=simpleChart(points,'reps')}
function simpleChart(points,unit){if(points.length<2)return '<div class="muted">At least two sessions are needed for a chart.</div>';const W=640,H=220,padL=52,padR=16,padT=16,padB=36,vals=points.map(p=>p.value),min=Math.min(...vals),max=Math.max(...vals),span=max-min||1,x=i=>padL+(W-padL-padR)*(i/(points.length-1)),y=v=>padT+(H-padT-padB)*(1-(v-min)/span),path=points.map((p,i)=>`${i?'L':'M'} ${x(i).toFixed(1)} ${y(p.value).toFixed(1)}`).join(' ');const mid=(min+max)/2;return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress chart"><line class="chart-grid" x1="${padL}" y1="${y(max)}" x2="${W-padR}" y2="${y(max)}"/><line class="chart-grid" x1="${padL}" y1="${y(mid)}" x2="${W-padR}" y2="${y(mid)}"/><line class="chart-grid" x1="${padL}" y1="${y(min)}" x2="${W-padR}" y2="${y(min)}"/><text class="chart-label" x="4" y="${y(max)+4}">${roundLabel(max)} ${unit}</text><text class="chart-label" x="4" y="${y(min)+4}">${roundLabel(min)}</text><path class="chart-line" d="${path}"/>${points.map((p,i)=>`<circle class="chart-dot" cx="${x(i)}" cy="${y(p.value)}" r="4"><title>${fmtDate(p.date)}: ${roundLabel(p.value)} ${unit}</title></circle>`).join('')}<text class="chart-label" x="${padL}" y="${H-8}">${fmtDate(points[0].date)}</text><text class="chart-label" text-anchor="end" x="${W-padR}" y="${H-8}">${fmtDate(points.at(-1).date)}</text></svg>`}
function roundLabel(v){return Math.abs(v)>=100?Math.round(v):Math.round(v*10)/10}
function renderWorkoutHistory(){const ws=[...data.workouts].sort((a,b)=>workoutSortValue(b).localeCompare(workoutSortValue(a)));document.getElementById('progressContent').innerHTML=ws.length?ws.map(w=>`<div class="card"><div class="row space-between"><strong>${escapeHTML(w.name)}</strong><span class="pill">${fmtDate(w.date)}</span></div>${w.exercises.map(e=>{const ex=getExercise(e.exerciseId);return `<div class="history-item"><strong>${escapeHTML(ex?.name||'Unknown')}</strong><div class="muted">${e.sets.map(s=>`${s.weight} kg × ${s.reps}`).join(' · ')}</div></div>`}).join('')}</div>`).join(''):'<div class="card">No workouts logged yet.</div>'}

function renderDataTools(){document.getElementById('app').innerHTML=`<button class="back" onclick="renderHome()">← Home</button><h1>Backup & Export</h1><div class="subtitle">Your data stays separate from the app code.</div><div class="grid"><button class="big-button" onclick="exportCSV()">Export for ChatGPT (CSV)</button><button class="big-button" onclick="exportBackup()">Full backup (JSON)</button><button class="big-button" onclick="document.getElementById('restoreFile').click()">Restore backup</button></div><input id="restoreFile" type="file" accept="application/json,.json" style="display:none" onchange="restoreBackup(this.files[0])"><div class="card section"><strong>What the ChatGPT export includes</strong><div class="muted" style="margin-top:6px">Date, workout, exercise order, exercise, set number, weight, reps, assumed RIR, and primary/secondary muscle tags. That makes it much easier to analyse plateaus, exercise order and weekly training volume.</div></div>`}
function downloadText(filename,text,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportCSV(){const rows=[['date','workout','exercise_order','exercise','set','weight_kg','reps','assumed_RIR','primary_muscles','secondary_muscles']];[...data.workouts].sort((a,b)=>workoutSortValue(a).localeCompare(workoutSortValue(b))).forEach(w=>w.exercises.forEach((e,ei)=>{const ex=getExercise(e.exerciseId)||{};e.sets.forEach((s,si)=>rows.push([w.date,w.name,ei+1,ex.name||'',si+1,s.weight,s.reps,1,(ex.primaryMuscles||[]).map(muscleName).join('; '),(ex.secondaryMuscles||[]).map(muscleName).join('; ')]))}));const csv=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n');downloadText('gym-training-data.csv',csv,'text/csv;charset=utf-8')}
function exportBackup(){downloadText('gym-tracker-backup-'+todayString()+'.json',JSON.stringify(data,null,2),'application/json')}
function restoreBackup(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const restored=migrate(JSON.parse(reader.result));if(!confirm('Replace the data on this device with this backup?'))return;data=restored;saveData();clearDraft();alert('Backup restored.');renderHome()}catch{alert('That file could not be read as a Gym Tracker backup.')}};reader.readAsText(file)}

renderHome();
</script>
</body>
